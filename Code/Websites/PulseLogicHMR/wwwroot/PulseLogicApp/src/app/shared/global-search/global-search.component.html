<div class="global-search-wrapper" style="position: relative; width: 100%;">
  <div class="search-container" style="position: relative; display: flex; align-items: center; width: 100%;">
    <i class="fa fa-search search-icon" *ngIf="!isLoading" style="position: absolute; left: 12px; color: var(--text-3, #94a3b8); pointer-events: none; z-index: 2;"></i>
    <i class="fa fa-spinner fa-spin search-icon" *ngIf="isLoading" style="position: absolute; left: 12px; color: var(--accent); pointer-events: none; z-index: 2;"></i>
    
    <input type="text" 
           class="global-search-input"
           [(ngModel)]="searchTerm" 
           (ngModelChange)="onSearchChange($event)"
           (focus)="searchTerm.length >= 2 ? showDropdown = true : null"
           placeholder="Search patients, doctors, records, settings..." 
           style="width: 100%; height: 100%; padding-left: 36px !important; padding-right: 36px !important;" />
           
    <i class="fa fa-times clear-icon" *ngIf="searchTerm" (click)="clearSearch()" style="position: absolute; right: 12px; cursor: pointer; color: var(--text-3, #94a3b8); z-index: 2;"></i>
  </div>

  <!-- WhatsApp Style Dropdown -->
  <div class="search-dropdown" *ngIf="showDropdown">
    <div class="dropdown-header">
      <span *ngIf="!isLoading && results.length > 0">Results found</span>
      <span *ngIf="!isLoading && results.length === 0 && searchTerm.length >= 2">No results found for "{{searchTerm}}"</span>
      <span *ngIf="isLoading">Searching...</span>
    </div>
    
    <div class="dropdown-body" *ngIf="results.length > 0">
      <div class="search-result-item" *ngFor="let result of results" (click)="onResultClick(result)">
        <div class="result-icon" [ngClass]="{'bg-primary': result.type === 'Patient', 'bg-warning': result.type === 'Setting'}">
          <i class="fa" [ngClass]="result.icon || 'fa-search'"></i>
        </div>
        <div class="result-content">
          <div class="result-title">
            <span class="highlight-text">{{ result.title }}</span>
            <span class="badge" [ngClass]="{'badge-success': result.type === 'Patient', 'badge-info': result.type === 'Setting'}">{{ result.type }}</span>
          </div>
          <div class="result-subtitle">{{ result.subtitle }}</div>
        </div>
      </div>
    </div>
    
    <div class="dropdown-footer" *ngIf="results.length > 0">
      <small>Click an item to open its details</small>
    </div>
  </div>
</div>
