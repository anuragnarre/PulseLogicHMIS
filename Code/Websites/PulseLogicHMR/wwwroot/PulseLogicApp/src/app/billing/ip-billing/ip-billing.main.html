<div class="wrapper">
  <div *ngIf="!showPatientContext">
    <div class="pl-card" style="margin-bottom: 24px;">
      <h3 class="pl-card-title" style="margin-bottom: 16px;">
        <i class="fa fa-user" style="margin-right: 8px;"></i> Admitted Patient List
      </h3>
      <div class="row">
        <div class="col-lg-12 col-sm-12">
          <pulselogic-grid [grid-colDefaults]="ipPatientGridColumns" [grid-data]="allInpatList"
                       (grid-actions)="IpBillingGridAction($event)" [NepaliDateInGridParams]="NepaliDateInGridSettings">
          </pulselogic-grid>
        </div>
      </div>
    </div>
  </div>
  <pat-ip-bill-summary *ngIf="showPatientContext" [patientId]="selPatId" [ipVisitId]="selVisitId"
                       (on-summary-closed)="OnSummaryWindowClosed($event)"></pat-ip-bill-summary>

</div>
