<base href="/">

<div class="pl-module-shell">

  <!-- Apple HIG Tab Bar (billing has extra secondary route display feature) -->
  <div class="modern-page-tabs pl-module-tabs">
    <ul *ngIf="validRoutes != undefined">

      <!--Primary items-->
      <li *ngFor="let route of primaryNavItems">
        <a routerLink="{{route.RouterLink}}" [routerLinkActive]="'link3-active'" *ngIf="route.IsSecondaryNavInDropdown!=1">
          {{ route.DisplayName }}
        </a>
      </li>

      <!--Secondary overflow dropdown-->
      <li *ngIf="secondaryNavItems && secondaryNavItems.length>0" class="dropdown bil-hr-bar">
        <a href="JavaScript:void(0);" class="dropdown-toggle" data-toggle="dropdown" aria-expanded="false">
          More&nbsp;<i class="fa fa-angle-down"></i>
        </a>
        <ul class="dropdown-menu bil-hr-dropdown">
          <li class="hr-ddlCstm" *ngFor="let route of secondaryNavItems">
            <a routerLink="{{route.RouterLink}}" [routerLinkActive]="'link3-active'">
              {{ route.DisplayName }}
            </a>
          </li>
        </ul>
      </li>

      <!--Active secondary route chip-->
      <li *ngIf="coreService.currSelectedSecRoute">
        <a routerLink="{{coreService.currSelectedSecRoute.RouterLink}}" class='link3-active'>
          {{ coreService.currSelectedSecRoute.DisplayName }}
        </a>
        <a class="close-sec-rt" (click)="coreService.RemoveSelectedSecRoute()" style="cursor:pointer; padding-left:4px;">
          <i class="fa fa-close"></i>
        </a>
      </li>

    </ul>
  </div>

  <!-- Content -->
  <div class="pl-module-content">
    <router-outlet></router-outlet>
  </div>

</div>

<!-- Apple HIG module shell -->
<style>
.pl-module-shell { display: flex; flex-direction: column; min-height: 100%; }
.pl-module-content { flex: 1; padding: 28px 32px; }
.page-container, .page-wrapper, .page-content { background: transparent !important; }
</style>
